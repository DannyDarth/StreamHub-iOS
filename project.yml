name: StreamHub
options:
  bundleIdPrefix: com.streamhub
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  StreamHub:
    type: application
    platform: iOS
    sources:
      - path: StreamHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.streamhub.ios
        # the app's version: a version without a "streamhub-ios-v<version>" release is published as one
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "110"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: StreamHub
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGNING_ALLOWED: NO
