name: StreamHub iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Serialize builds and prerelease publishing for the same branch.
# Do not interrupt an active build just because another commit was pushed.
concurrency:
  group: streamhub-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ios:
    # Use a specific supported macOS runner generation instead of the moving latest alias.
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify selected Xcode toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          case "$XCODE_VERSION" in
            16.*|26.*) ;;
            *)
              echo "::error::Unexpected Xcode version: $XCODE_VERSION"
              exit 1
              ;;
          esac
          xcrun --sdk iphoneos --show-sdk-path >/dev/null
          echo "Verified supported Xcode toolchain: $XCODE_VERSION with iPhoneOS SDK"
      - name: Install and verify XcodeGen 2.46.0
        env:
          XCODEGEN_VERSION: "2.46.0"
          # sha256 of xcodegen.zip from https://github.com/yonaskolb/XcodeGen/releases/tag/2.46.0
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          # Homebrew only offers the newest XcodeGen, so fetch the reviewed release directly
          # and refuse it unless the checksum matches.
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          INSTALLED_VERSION="$("$RUNNER_TEMP/xcodegen/bin/xcodegen" --version)"
          echo "Installed XcodeGen: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "Version: ${XCODEGEN_VERSION}" ] && [ "$INSTALLED_VERSION" != "${XCODEGEN_VERSION}" ]; then
            echo "::error::Expected XcodeGen ${XCODEGEN_VERSION}; refusing to build with an unreviewed version"
            exit 1
          fi
      - name: Prepare selected StreamHub app icon
        run: |
          ICON=StreamHub/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          test -s "$ICON"
          sips --resampleHeightWidth 1024 1024 "$ICON" --out "$ICON"
          sips -g pixelWidth -g pixelHeight "$ICON"
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned iPhone app
        run: |
          xcodebuild -project StreamHub.xcodeproj \
            -scheme StreamHub \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/StreamHubDerived" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for local signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/StreamHubDerived/Build/Products/Release-iphoneos/StreamHub.app"
          test -s "$APP/Info.plist"
          test -s "$APP/StreamHub"
          # StreamHub does not need protected-device permission prompts or background modes.
          # Fail if a future project change adds one without explicit security review.
          PLIST_JSON="$(plutil -convert json -o - "$APP/Info.plist")"
          printf '%s' "$PLIST_JSON" | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          usage = sorted(key for key in info if key.startswith("NS") and key.endswith("UsageDescription"))
          background = info.get("UIBackgroundModes", [])
          if usage or background:
              print("::error::Unexpected iOS privacy permission or background mode:", usage, background)
              sys.exit(1)
          print("Verified no protected-device usage descriptions or background modes")
          # ATS defaults to secure transport when no override is configured.
          ats = info.get("NSAppTransportSecurity", {})
          if not isinstance(ats, dict) or ats:
              print("::error::Unexpected App Transport Security override; review before publishing:", ats)
              sys.exit(1)
          print("Verified default App Transport Security policy (no exceptions)")
          '
          # Validate the Release-iphoneos output is an actual iPhone arm64 binary.
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test "$EXECUTABLE" = "StreamHub"
          ARCHS="$(/usr/bin/lipo -archs "$APP/$EXECUTABLE")"
          case " $ARCHS " in
            *" arm64 "*) ;;
            *)
              echo "::error::Release iPhone executable is missing arm64 architecture: $ARCHS"
              exit 1
              ;;
          esac
          echo "Verified Release iPhone executable architecture: $ARCHS"
          # Refuse to package an unexpected app or a simulator-only build.
          PLIST="$APP/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          PLATFORM="$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$PLIST")"
          DEVICE_FAMILY="$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$PLIST")"
          test "$BUNDLE_ID" = "com.streamhub.ios"
          test "$PLATFORM" = "iphoneos"
          test "$DEVICE_FAMILY" = "1"
          # The IPA must remain unsigned so it can be signed locally on Windows.
          if /usr/bin/codesign --verify "$APP" >/dev/null 2>&1; then
            echo "::error::App is unexpectedly code signed; refusing unsigned IPA packaging"
            exit 1
          fi
          if [ -e "$APP/embedded.mobileprovision" ] || [ -e "$APP/_CodeSignature" ]; then
            echo "::error::App contains signing or provisioning material"
            exit 1
          fi
          echo "Verified unsigned iPhone Release bundle: $BUNDLE_ID ($PLATFORM)"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/Payload/StreamHub.app"
          cd "$RUNNER_TEMP"
          zip -qry "$GITHUB_WORKSPACE/dist/StreamHub-iOS-unsigned.ipa" Payload/StreamHub.app
      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streamhub-ios-unsigned-ipa
          path: dist/StreamHub-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  publish-test:
    name: Publish test build IPA
    needs: ios
    timeout-minutes: 10
    # Pull requests from this repository only (never forks): one rolling "test build" prerelease
    # whose IPA is a direct download (not a zip), for signing services that take a link.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == 'DannyDarth/StreamHub-iOS'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: streamhub-ios-test-build
      cancel-in-progress: false
    steps:
      - name: Download built IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: streamhub-ios-unsigned-ipa
          path: dist
      - name: Verify downloaded IPA structure
        run: |
          set -euo pipefail
          IPA="dist/StreamHub-iOS-unsigned.ipa"
          test -s "$IPA"
          unzip -tq "$IPA"
          unzip -Z -1 "$IPA" | grep -Fxq 'Payload/StreamHub.app/Info.plist'
          mv "$IPA" dist/StreamHub-iOS-test-unsigned.ipa
          (cd dist && shasum -a 256 StreamHub-iOS-test-unsigned.ipa > StreamHub-iOS-test-unsigned.ipa.sha256)
      - name: Replace the test build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TAG="streamhub-ios-test"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          NOTES="$(printf 'Test build from pull request #%s (branch %s, commit %s).\n\nDirect IPA link: https://github.com/%s/releases/download/%s/StreamHub-iOS-test-unsigned.ipa\n\nNot a release: the update banner ignores it.\n' "$PR" "$BRANCH" "$SHA" "$GITHUB_REPOSITORY" "$TAG")"
          gh release create "$TAG" \
            dist/StreamHub-iOS-test-unsigned.ipa \
            dist/StreamHub-iOS-test-unsigned.ipa.sha256 \
            --title "StreamHub iOS test build (PR #${PR})" \
            --notes "$NOTES" \
            --target "$SHA" \
            --prerelease

  publish:
    name: Publish unsigned IPA prerelease
    needs: ios
    timeout-minutes: 10
    # Only publish builds of main from this repository (never from pull requests or forks).
    if: >-
      github.repository == 'DannyDarth/StreamHub-iOS' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the version and release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            project.yml
            release-notes.md
          sparse-checkout-cone-mode: false
      - name: Download built IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: streamhub-ios-unsigned-ipa
          path: dist
      - name: Verify downloaded IPA structure
        run: |
          set -euo pipefail
          IPA="dist/StreamHub-iOS-unsigned.ipa"
          test -s "$IPA"
          unzip -tq "$IPA"
          unzip -Z -1 "$IPA" | grep -Fxq 'Payload/StreamHub.app/Info.plist'
          echo "IPA archive integrity and expected app bundle verified"
          shasum -a 256 "$IPA"
          (cd dist && shasum -a 256 StreamHub-iOS-unsigned.ipa > StreamHub-iOS-unsigned.ipa.sha256)
          (cd dist && shasum -a 256 -c StreamHub-iOS-unsigned.ipa.sha256)
      - name: Publish direct IPA download in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s dist/StreamHub-iOS-unsigned.ipa
          TAG="streamhub-ios-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          NOTES="$(printf 'Unsigned iOS IPA for local signing on Windows.\\n\\nSource commit: %s\\nSource branch: %s\\nWorkflow run: %s\\nWorkflow attempt: %s\\nActions URL: %s\\nSHA-256 checksum: see attached .sha256 file.\\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUN_URL")"
          gh release create "$TAG" \
            "dist/StreamHub-iOS-unsigned.ipa#StreamHub-iOS-unsigned.ipa" \
            "dist/StreamHub-iOS-unsigned.ipa.sha256#StreamHub-iOS-unsigned.ipa.sha256" \
            --title "StreamHub iOS build ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --prerelease
      - name: Publish the app version as a release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -n 1)"
          test -n "$VERSION"
          TAG="streamhub-ios-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          test -s release-notes.md
          cp dist/StreamHub-iOS-unsigned.ipa "dist/StreamHub-iOS-${VERSION}-unsigned.ipa"
          (cd dist && shasum -a 256 "StreamHub-iOS-${VERSION}-unsigned.ipa" > "StreamHub-iOS-${VERSION}-unsigned.ipa.sha256")
          gh release create "$TAG" \
            "dist/StreamHub-iOS-${VERSION}-unsigned.ipa" \
            "dist/StreamHub-iOS-${VERSION}-unsigned.ipa.sha256" \
            --title "StreamHub iOS ${VERSION}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --latest
      - name: Keep only the newest 5 build prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Delete older build prereleases together with their tags so tags don't pile up.
          gh release list --limit 200 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("streamhub-ios-build-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r TAG; do
            echo "Deleting old prerelease $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          done
